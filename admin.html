<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jack's Brand | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #1a1a1a;
      --accent:       #d4a574;
      --accent-dark:  #b8925f;
      --bg:           #f4f5f7;
      --surface:      #ffffff;
      --border:       #e2e4e9;
      --text:         #1a1a1a;
      --muted:        #6b7280;
      --success:      #16a34a;
      --success-bg:   #dcfce7;
      --warning:      #b45309;
      --warning-bg:   #fef3c7;
      --danger:       #dc2626;
      --danger-bg:    #fee2e2;
      --info:         #1d4ed8;
      --info-bg:      #dbeafe;
      --radius:       8px;
      --shadow:       0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login screen ───────────────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-logo h1 span { color: var(--accent); }

    .login-logo p {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      text-align: center;
      min-height: 1.2em;
    }

    /* ── Dashboard layout ───────────────────────────────────────────────── */
    #dashboard-screen { display: none; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .topbar-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .topbar-brand span { color: var(--accent); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar-right .badge-admin {
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .btn-logout {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Stat cards ─────────────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .stat-icon.total    { background: var(--info-bg);    color: var(--info); }
    .stat-icon.revenue  { background: var(--success-bg); color: var(--success); }
    .stat-icon.pending  { background: var(--warning-bg); color: var(--warning); }
    .stat-icon.done     { background: var(--success-bg); color: var(--success); }
    .stat-icon.failed   { background: var(--danger-bg);  color: var(--danger); }

    .stat-body { flex: 1; }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
    }

    /* ── Orders panel ───────────────────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .filters-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-select,
    .filter-input {
      padding: 0.45rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      background: var(--surface);
    }

    .filter-select:focus,
    .filter-input:focus { border-color: var(--accent); }

    .btn-filter {
      padding: 0.45rem 1rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-filter:hover { opacity: 0.85; }

    .btn-export {
      padding: 0.45rem 1rem;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-export:hover { opacity: 0.85; }

    /* ── Table ──────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      cursor: pointer;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    tbody td {
      padding: 0.85rem 1rem;
      vertical-align: middle;
    }

    .order-ref {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-pending   { background: var(--warning-bg); color: var(--warning); }
    .badge-completed { background: var(--success-bg); color: var(--success); }
    .badge-failed    { background: var(--danger-bg);  color: var(--danger); }

    .mpesa-ref {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .empty-state p { font-size: 0.9rem; }

    /* ── Loading spinner ────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      transform: translateY(20px);
      transition: transform 0.2s;
    }

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title { font-size: 1rem; font-weight: 600; }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
      padding: 0.25rem;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 1.5rem; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .detail-item label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .detail-item span {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .items-table-wrap { margin-top: 1rem; }

    .items-table-wrap h4 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .items-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .items-table td {
      padding: 0.6rem 0.75rem;
      border-top: 1px solid var(--border);
    }

    .items-table tfoot td {
      font-weight: 700;
      border-top: 2px solid var(--border);
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .topbar { padding: 0 1rem; }
      .main { padding: 1rem; }
      .panel-header { flex-direction: column; align-items: flex-start; }
      .detail-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- LOGIN SCREEN                                                           -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Jack's <span>Brand</span></h1>
      <p>Admin Dashboard</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="login-btn">
        Sign In
      </button>
      <p class="login-error" id="login-error"></p>
    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- DASHBOARD SCREEN                                                       -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div id="dashboard-screen">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">Jack's <span>Brand</span></div>
    <div class="topbar-right">
      <span class="badge-admin">Admin</span>
      <button class="btn-logout" id="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </header>

  <main class="main">

    <!-- Stat cards -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon total"><i class="fa-solid fa-receipt"></i></div>
        <div class="stat-body">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="stat-total">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon revenue"><i class="fa-solid fa-coins"></i></div>
        <div class="stat-body">
          <div class="stat-label">Revenue (KES)</div>
          <div class="stat-value" id="stat-revenue">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
        <div class="stat-body">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon done"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-body">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="stat-completed">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon failed"><i class="fa-solid fa-circle-xmark"></i></div>
        <div class="stat-body">
          <div class="stat-label">Failed</div>
          <div class="stat-value" id="stat-failed">—</div>
        </div>
      </div>
    </div>

    <!-- Orders panel -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Orders</h2>
        <div class="filters-row">
          <select class="filter-select" id="filter-status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
          </select>
          <input type="date" class="filter-input" id="filter-from" title="From date" />
          <input type="date" class="filter-input" id="filter-to" title="To date" />
          <button class="btn-filter" id="apply-filters-btn">
            <i class="fa-solid fa-filter"></i> Filter
          </button>
          <button class="btn-filter" id="reset-filters-btn" style="background:#6b7280;">
            <i class="fa-solid fa-rotate-left"></i> Reset
          </button>
          <button class="btn-export" id="export-btn">
            <i class="fa-solid fa-file-csv"></i> Export CSV
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="orders-table">
          <thead>
            <tr>
              <th>Order Ref</th>
              <th>Phone</th>
              <th>Amount (KES)</th>
              <th>Status</th>
              <th>M-Pesa Ref</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <i class="fa-solid fa-spinner fa-spin"></i>
                  <p>Loading orders…</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- ORDER DETAIL MODAL                                                     -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="order-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Order Detail</h3>
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
